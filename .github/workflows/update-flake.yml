name: Update flake inputs

# Weekly (and on demand): run `nix flake update`, build the framebook system
# from the refreshed lock, sign + push its closure to the private B2 cache, and
# only then commit the new flake.lock straight to `flaked` (the default branch).
#
# No pull request, no third-party action: the build IS the gate. The job is
# fail-closed — if the updated lock doesn't build, it stops before committing,
# so a broken update never reaches `flaked` and never reaches the daily
# `system.autoUpgrade` on framebook. Pushing the closure first also warms the
# B2 cache so that autoUpgrade substitutes instead of compiling.
#
# Pinned inputs: `nix flake update` advances every input. If a bump would break
# the build it fails here (no commit) — re-pin by hand per README "Pinned Items"
# and push. (No inputs are pinned today.) A pin needed for a reason OTHER than a
# build break would NOT be caught here, since the closure still builds.
#
# Note: the push to `flaked` uses GITHUB_TOKEN, so it does not itself trigger
# other workflows (e.g. asahi-fairydust-kernel). Run those by hand
# (workflow_dispatch) or a later human push if a lock bump needs them.
#
# Secrets live in GitHub environment `god` (same as asahi-fairydust-kernel.yml):
#   NIX_SIGNING_KEY       CI signing key `reinthal-nix-store-ci`
#   B2_ACCESS_KEY_ID      Backblaze B2 key id with write access
#   B2_SECRET_ACCESS_KEY  Backblaze B2 secret

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC
  workflow_dispatch:

concurrency:
  group: update-flake
  cancel-in-progress: true

permissions:
  contents: write

env:
  CACHE_URL: "s3://reinthal-nix-store?endpoint=s3.eu-central-003.backblazeb2.com&scheme=https&region=eu-central-003"
  SYSTEM_ATTR: ".#nixosConfigurations.framebook.config.system.build.toplevel"

jobs:
  update:
    name: Update inputs, build + push framebook, commit to flaked
    runs-on: ubuntu-24.04
    # Secrets (B2_*, NIX_SIGNING_KEY) are environment-scoped, not repo-scoped.
    environment: god
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        # A full system closure (GUI stack) plus the store can outgrow the
        # hosted image; reclaim the toolchains we never use.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          ref: flaked

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://reinthal-nix-store.s3.eu-central-003.backblazeb2.com https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = reinthal-nix-store:PKEXEQXsLCz9vWz71iaD1TYRLa4XbDQxjL8rrAccDwg= reinthal-nix-store-ci:uauSdxPq9pb+rA+eydO4XfH6AUr4m/nBigsaycX0uVs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Update flake inputs
        run: |
          nix flake update
          echo "### flake.lock diff" >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff -- flake.lock | head -200 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build framebook system from the new lock
        # Fail-closed: if the update doesn't build, the job stops here and
        # nothing is committed. Check the Actions tab for a red run.
        run: nix build -L --no-link --print-build-logs "$SYSTEM_ATTR"

      - name: Sign and push closure to B2 cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp)
          printf '%s' "$NIX_SIGNING_KEY" > "$keyfile"
          out=$(nix eval --raw "$SYSTEM_ATTR.outPath")
          nix store sign --recursive --key-file "$keyfile" "$out"
          nix copy --to "$CACHE_URL" "$out"
          rm -f "$keyfile"
          echo "pushed $out"

      - name: Commit updated lock to flaked
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(flake): update inputs" -- flake.lock
          git push origin HEAD:flaked
