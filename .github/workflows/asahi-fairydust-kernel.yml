name: Asahi fairydust kernel

# Builds the linux-asahi-fairydust kernel used by the `nixbook` host on a
# GitHub-hosted arm64 runner, signs it with the repo's Nix cache key and pushes
# the closure to the private Backblaze B2 binary cache so `switch` on the
# laptop substitutes instead of compiling for ~1h.
#
# Required secrets (GitHub environment `god`, see `gh secret list --env god`):
#   NIX_SIGNING_KEY       dedicated CI signing key `reinthal-nix-store-ci`
#                         (public half: ci-pub-key.pub, trusted in flake.nix)
#   B2_ACCESS_KEY_ID      Backblaze B2 application key id with write access
#   B2_SECRET_ACCESS_KEY  Backblaze B2 application key

on:
  push:
    branches: [flaked]
    paths:
      - pkgs/linux-asahi-fairydust/**
      - overlays/default.nix
      - nixos/hosts/nixbook/**
      - flake.lock
      - .github/workflows/asahi-fairydust-kernel.yml
  workflow_dispatch:

concurrency:
  group: asahi-fairydust-kernel
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_URL: "s3://reinthal-nix-store?endpoint=s3.eu-central-003.backblazeb2.com&scheme=https&region=eu-central-003"
  # The exact derivation nixbook boots: same overlay stack and kernelPatches.
  KERNEL_ATTR: ".#nixosConfigurations.nixbook.config.boot.kernelPackages.kernel"

jobs:
  build:
    name: Build and push (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    # Secrets (B2_*, NIX_SIGNING_KEY) are environment-scoped, not repo-scoped.
    environment: god
    timeout-minutes: 350
    steps:
      - name: Free runner disk space
        # Kernel build with DEBUG_INFO needs ~20 GB; the hosted image ships
        # toolchains we never use.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 0
            sandbox = true
            substituters = https://reinthal-nix-store.s3.eu-central-003.backblazeb2.com https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = reinthal-nix-store:PKEXEQXsLCz9vWz71iaD1TYRLa4XbDQxjL8rrAccDwg= reinthal-nix-store-ci:uauSdxPq9pb+rA+eydO4XfH6AUr4m/nBigsaycX0uVs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Evaluate kernel derivation
        id: eval
        run: |
          drv=$(nix eval --raw "$KERNEL_ATTR.drvPath")
          out=$(nix eval --raw "$KERNEL_ATTR.outPath")
          echo "drv=$drv" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "kernel: $out"

      - name: Skip if already cached
        id: cached
        run: |
          if nix path-info --store "https://reinthal-nix-store.s3.eu-central-003.backblazeb2.com" \
               "${{ steps.eval.outputs.out }}" >/dev/null 2>&1; then
            echo "already in cache, nothing to do"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight B2 credentials
        # Fail here, not after a 2 h build: verify the secrets exist and can
        # write to the bucket by PUTting and deleting a tiny probe object.
        if: steps.cached.outputs.hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY NIX_SIGNING_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::repository secret for $v is not set"
              exit 1
            fi
          done
          probe="https://s3.eu-central-003.backblazeb2.com/reinthal-nix-store/ci-preflight-${GITHUB_RUN_ID}"
          body=$(mktemp)
          code=$(curl --silent --output "$body" --write-out '%{http_code}' \
            --aws-sigv4 "aws:amz:eu-central-003:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -X PUT --data-binary "preflight" "$probe")
          if [ "$code" != "200" ]; then
            echo "::error::B2 PUT probe returned HTTP $code"
            cat "$body"; echo
            echo "keyID prefix: ${AWS_ACCESS_KEY_ID:0:6}… length ${#AWS_ACCESS_KEY_ID}; secret length ${#AWS_SECRET_ACCESS_KEY}"
            exit 1
          fi
          curl --silent --aws-sigv4 "aws:amz:eu-central-003:s3" \
            --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" \
            -X DELETE "$probe" || true
          echo "B2 write access OK"

      - name: Build kernel
        if: steps.cached.outputs.hit != 'true'
        run: |
          nix build -L --no-link --print-build-logs "$KERNEL_ATTR"
          df -h /

      - name: Sign and push to B2 cache
        if: steps.cached.outputs.hit != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keyfile=$(mktemp)
          printf '%s' "$NIX_SIGNING_KEY" > "$keyfile"
          out="${{ steps.eval.outputs.out }}"
          nix store sign --recursive --key-file "$keyfile" "$out"
          nix copy --to "$CACHE_URL" "$out"
          rm -f "$keyfile"
          echo "pushed $out"

      - name: Save kernel as artifact if push failed
        # Insurance: the build is ~2 h on this runner. If signing/pushing
        # fails, keep the closure so it can be pushed by hand:
        #   nix copy --from file://$PWD/kernel-nar --all --no-check-sigs
        #   nix store sign --recursive --key-file <key> <out>
        #   nix copy --to <CACHE_URL> <out>
        if: failure() && steps.cached.outputs.hit != 'true'
        run: |
          out="${{ steps.eval.outputs.out }}"
          if [ -e "$out" ]; then
            nix copy --to "file://$PWD/kernel-nar" "$out"
            du -sh kernel-nar
          fi

      - uses: actions/upload-artifact@v4
        if: failure() && steps.cached.outputs.hit != 'true' && hashFiles('kernel-nar/nix-cache-info') != ''
        with:
          name: linux-asahi-fairydust-nar
          path: kernel-nar
          retention-days: 7
          if-no-files-found: ignore
