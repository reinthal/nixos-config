name: Vulnix scan

# Scans the runtime closure of the framebook system for known CVEs with vulnix
# (matches package name/version against the NVD feeds).
#
# The scan itself is scripts/vulnix-scan.sh; run it locally the same way.
#
# Findings go to the job summary and a JSON artifact. The job fails (so GitHub
# notifies) when vulnix itself errors or when any finding has a CVSS v3 score
# above CVSS_FAIL_ABOVE. Lower scores are report-only: nixpkgs always carries
# some open/disputed CVEs, so failing on every one would be noise. Silence a
# reviewed false positive with the whitelist below.
#
# Runs daily after update-flake.yml (04:00), since that workflow's lock commit
# uses GITHUB_TOKEN and so does not trigger the push event below.
#
# Whitelist: if `vulnix-whitelist.toml` exists at the repo root it is applied
# (format: https://github.com/nix-community/vulnix#whitelisting). Generate a
# starting point with
# `nix run nixpkgs#vulnix -- -C /run/current-system -W vulnix-whitelist.toml`.
#
# No secrets needed: the B2 cache is read anonymously like in the other jobs.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC, after update-flake
  push:
    branches: [flaked]
    paths:
      - flake.lock
      - vulnix-whitelist.toml
      - scripts/vulnix-scan.sh
      - .github/workflows/vulnix.yml
  workflow_dispatch:

concurrency:
  group: vulnix
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Scan framebook closure
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free runner disk space
        # The framebook closure (GUI stack) is substituted in full.
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://reinthal-nix-store.s3.eu-central-003.backblazeb2.com https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = reinthal-nix-store:PKEXEQXsLCz9vWz71iaD1TYRLa4XbDQxjL8rrAccDwg= reinthal-nix-store-ci:uauSdxPq9pb+rA+eydO4XfH6AUr4m/nBigsaycX0uVs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Restore NVD feed cache
        # vulnix downloads and parses the yearly NVD feeds on first run; keep
        # the parsed DB between runs and let vulnix refresh it incrementally.
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ github.run_id }}
          restore-keys: vulnix-nvd-

      - name: Run vulnix
        # Same script as locally. It builds the system (normally substituted
        # from B2, which update-flake.yml pushes to), scans its runtime closure
        # and prints a markdown table.
        run: |
          # Steps run under `bash -e`; turn -e off so exit 2 (findings) reaches
          # the rc check below instead of killing the step at the pipeline.
          set +e -uo pipefail
          scripts/vulnix-scan.sh -o vulnix.json framebook | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          # 0: nothing found, 2: vulnerabilities found, anything else: error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::vulnix scan exited with $rc"
            exit "$rc"
          fi
          [ "$rc" -eq 0 ] && exit 0
          high=$(jq -r --argjson t "$CVSS_FAIL_ABOVE" '
            map(select(([.cvssv3_basescore[]?] | max // 0) > $t) | .name)
            | join(", ")' vulnix.json)
          if [ -n "$high" ]; then
            echo "::error::CVSS > $CVSS_FAIL_ABOVE in: $high"
            exit 1
          fi
        env:
          CVSS_FAIL_ABOVE: 8

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('vulnix.json') != ''
        with:
          name: vulnix-framebook
          path: vulnix.json
          retention-days: 30
